# The cache harness for elioseverojunior/rust-toolchain: a seed job that
# installs a tool and plants markers, and a warm job that proves those markers
# round-tripped through the archive. It asserts things about the ACTION.
# rust-toolchian-setup.yml asserts things about the CODE and builds the real
# crate; this one never compiles it, overwriting the root Cargo.toml with a
# synthetic probe manifest in both jobs instead.
#
# Two notes for anyone reading the step comments below, which were inherited
# wholesale from the action's own repository:
#
#   - They reference `act-matrix.yml`, `cicd.yml`, `paths.test.ts`,
#     `src/index.ts` and a "design doc". None of those exist here. Read them as
#     provenance for why a check is shaped the way it is, not as pointers.
#   - Several are written for `act`, the local runner, and say so -- notably
#     "expected false under act" for `cache-hit`. On real GitHub Actions the
#     cache service preserves key case, so a genuine full hit reports true.
#     The assertions here are the weaker ones act can prove, so they still pass
#     on GitHub; they simply prove less than they could.

name: Rust Toolchain On-Demand Setup

# Manual only -- which is what "on-demand" in the filename means, and it is
# load-bearing rather than cosmetic.
#
# The GitHub cache is repository-scoped, not workflow-scoped. Running this on
# every push, alongside rust-toolchian-setup.yml, puts two workflows in the same
# cache namespace with no ordering between them: this workflow's seed job and
# that workflow's build job would race to populate overlapping layers, and each
# one's result would depend on which finished first. The distinct
# `cache-key-suffix` values (`act-cache` here, `project` there) keep the keys
# apart, but a manual trigger is what makes the separation obvious rather than
# something a reader has to reconstruct from two files.
#
# It is also the honest cost model: this harness deliberately compiles a probe
# crate and `cargo install`s a tool. That is minutes of runner time to verify
# the action, which changes on its own release schedule and not on yours.
on:
  workflow_dispatch:

jobs:
  seed:
    name: Seed The Cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Prepare Isolated Rustup Home
        shell: bash
        run: |
          # See act-matrix.yml for the full rationale: mutating the image's
          # pre-installed toolchain fails on overlayfs with EXDEV, because a
          # directory rename cannot cross from a lower image layer to the upper
          # one. A run-time-created RUSTUP_HOME keeps every rename in one layer.
          rustup_home="${RUNNER_TEMP:-/tmp}/rustup"
          mkdir -p "$rustup_home"
          echo "RUSTUP_HOME=$rustup_home" >> "$GITHUB_ENV"

      # Byte-identical to the warm job's. The channel feeds `cachekey-full`,
      # which is a segment of the build key, so a different one here would
      # derive a different key and miss by construction.
      - name: Write rust-toolchain.toml
        shell: bash
        run: |
          set -eo pipefail

          cat > rust-toolchain.toml <<'EOF'
          [toolchain]
          channel = "1.97"
          profile = "minimal"
          EOF

      # Root, not act-probe/: checkMsrv always resolves
      # `$GITHUB_WORKSPACE/Cargo.toml` and runs `cargo metadata` there, so a
      # manifest under act-probe/ would never be seen (cache-workspaces has no
      # bearing on the MSRV check — a recorded, deliberate scope limit).
      #
      # rust-version 1.88 and cfg-if's own declared MSRV are both at or below
      # the "1.97" channel above, so msrv-effective resolves to 1.88 and this
      # graph is expected to satisfy the check -- the happy path the design doc
      # lists as untested end to end.
      # msrv-check: error below makes that self-enforcing: if crates.io drift
      # ever raised the real requirement past 1.97, this job would fail loudly
      # instead of a passing assertion quietly meaning nothing.
      #
      # Note which direction that check runs, because it is only half the
      # story: it proves the graph does not need MORE than 1.97. It says
      # nothing about whether the code still builds on the 1.88 it CLAIMS,
      # and nine releases of headroom is a lot of room to rot in. The `msrv`
      # job in rust-toolchian-setup.yml is what closes that gap -- and it lives
      # there, not here, because this workflow is manual and a floor that is
      # only checked when somebody remembers to click a button is not checked.
      #
      # edition 2024 carries a floor of its own, and it binds twice: the
      # declared rust-version must be >= 1.85, and so must the image's
      # PRE-INSTALLED toolchain, because `cargo generate-lockfile` below runs
      # before the action has set RUSTUP_TOOLCHAIN. edition 2021 had no such
      # coupling to the runner image.
      - name: Write Root Cargo.toml For The MSRV Check
        shell: bash
        run: |
          set -eo pipefail

          cat > Cargo.toml <<'EOF'
          [package]
          name = "act-cache-msrv-probe"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.88"

          [dependencies]
          cfg-if = "1"
          EOF

          # `cargo metadata --locked`, which checkMsrv runs internally,
          # refuses to resolve without an existing, up-to-date Cargo.lock.
          # Generated here with the image's pre-installed toolchain -- see
          # "Prepare Isolated Rustup Home" above -- since the action has not
          # run yet and RUSTUP_TOOLCHAIN is still unset.
          cargo generate-lockfile

      # `hexyl` is pinned deliberately. It is unambiguously a binary crate whose
      # binary name matches its crate name — `ensureTools` probes
      # `<crate> --version`, so a crate like `ripgrep`, whose binary is `rg`,
      # would fail that probe and reinstall every run. It also has few enough
      # dependencies to compile in a container without dominating the run.
      #
      # Pinned rather than `latest` so the derived `bin` key is stable across
      # runs; an unpinned tool would move the key every time upstream released.
      - name: Run Rust Toolchain Action
        id: rust-toolchain
        uses: elioseverojunior/rust-toolchain@v0
        with:
          cache: true
          # The ROOT lock, which the step above just generated -- act-probe has
          # no manifest yet at this point in the job (it is written by "Build A
          # Probe Crate" further down), so `act-probe/Cargo.lock` matches
          # nothing and hashFiles returns ''. The action rejects an empty hash
          # rather than deriving a key that would hit forever.
          cache-key-hash: ${{ hashFiles('Cargo.lock') }}
          cache-key-suffix: act-cache
          cache-workspaces: act-probe -> act-probe/target
          cargo-tools: hexyl@0.17.0
          msrv-check: error

      # Proves the MSRV check ran against the REAL graph `cargo metadata` just
      # resolved, not a fake `MetadataReader` — the gap the design doc's
      # Testing section left open. `msrv-effective` is asserted non-empty
      # rather than to an exact value: cfg-if's own declared MSRV, if any, can
      # change upstream, and the point here is that the check ran and found
      # *something* in a real graph, not pinning a moving external number.
      - name: Verify MSRV Against A Real Dependency Graph
        shell: bash
        env:
          MSRV: ${{ steps.rust-toolchain.outputs.msrv }}
          MSRV_EFFECTIVE: ${{ steps.rust-toolchain.outputs.msrv-effective }}
          MSRV_SOURCE: ${{ steps.rust-toolchain.outputs.msrv-source }}
        run: |
          set -eo pipefail

          echo "msrv:           $MSRV"
          echo "msrv-effective: $MSRV_EFFECTIVE"
          echo "msrv-source:    $MSRV_SOURCE"

          if [[ "$MSRV" != "1.88" ]]; then
            echo "::error::msrv is '$MSRV', expected '1.88' from the root Cargo.toml"
            exit 1
          fi
          if [[ "$MSRV_SOURCE" != "cargo-toml" ]]; then
            echo "::error::msrv-source is '$MSRV_SOURCE', expected 'cargo-toml'"
            exit 1
          fi
          if [[ -z "$MSRV_EFFECTIVE" ]]; then
            echo "::error::msrv-effective is empty; the check against the real graph did not run"
            exit 1
          fi

      # A real crate, so there is something for the post step to save. Without
      # one the build layer resolves to nothing, `saveCache` refuses an empty
      # path set, and the save path is never executed at all.
      #
      # `cfg-if` is deliberate: tiny, dependency-free, and downloading it is
      # what populates $CARGO_HOME/registry, without which the registry layer
      # has nothing to save either.
      - name: Build A Probe Crate
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p act-probe/src
          cat > act-probe/Cargo.toml <<'EOF'
          [package]
          name = "act-probe"
          version = "0.0.0"
          edition = "2021"

          # Detaches this from any ancestor workspace. Cargo walks up from a
          # manifest with no [workspace]/package.workspace of its own looking
          # for one; since the checkout root NOW also carries a Cargo.toml
          # (the MSRV probe below), an empty [workspace] here is what makes
          # act-probe unambiguously its own single-crate workspace regardless
          # of what that root manifest declares.
          [workspace]

          [dependencies]
          cfg-if = "1"
          EOF
          echo 'fn main() { println!("act probe"); }' > act-probe/src/main.rs

          cargo build --manifest-path act-probe/Cargo.toml

          test -d act-probe/target || { echo "::error::no target dir was produced"; exit 1; }

      # Two claims need evidence, and neither survives a naive check.
      #
      # "The tool round-trips" cannot be shown by finding hexyl on disk: a
      # broken restore would simply have reinstalled it, leaving the same
      # binary at the same version. "The shims stay out" cannot be shown by
      # listing the directory either, because rustup puts them there whether or
      # not they were archived.
      #
      # So mark both. A marker on hexyl must come BACK — only a restore
      # preserves it, since a reinstall overwrites the binary. A marker on the
      # rustup shim must NOT — its return would mean the shim was archived.
      # One marker proves the layer carries what it should, the other that it
      # carries nothing it should not.
      #
      # Appending is safe: trailing bytes on an ELF binary are ignored, both
      # binaries still run, and this is the job's last step so nothing invokes
      # rustup afterwards. The hexyl marker survives the seed job's own
      # post-step because ensureTools already ran and left the binary alone.
      - name: Plant Bin-Layer Evidence
        shell: bash
        run: |
          set -eo pipefail

          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          find "$bin" -maxdepth 1 -mindepth 1 -exec basename {} \; | sort | sed 's/^/  installed: /'

          # The action installed hexyl above. Marking THAT binary is what lets
          # the warm job tell a cache restore from a fresh reinstall: both end
          # with hexyl present at 0.17.0, so its mere presence proves nothing.
          # Only the marker distinguishes them, and it survives because
          # ensureTools sees the right version and leaves the binary alone.
          test -x "$bin/hexyl" || {
            echo "::error::the action did not install hexyl, so nothing downstream can be proved"
            exit 1
          }
          printf 'TOOL_MARKER_FROM_SEED' >> "$bin/hexyl"

          # The shim marker is the mirror image: it must NOT come back.
          printf 'SHIM_MARKER_DO_NOT_ARCHIVE' >> "$bin/rustup"

          echo "marked the installed hexyl and the rustup shim"

      - name: Report The Derived Keys
        shell: bash
        env:
          CACHE_JSON: ${{ steps.rust-toolchain.outputs.cache }}
        run: |
          set -eo pipefail

          echo "seed derived: $CACHE_JSON"

  warm:
    name: Verify The Warm Restore
    needs: [seed]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Prepare Isolated Rustup Home
        shell: bash
        run: |
          rustup_home="${RUNNER_TEMP:-/tmp}/rustup"
          mkdir -p "$rustup_home"
          echo "RUSTUP_HOME=$rustup_home" >> "$GITHUB_ENV"

      - name: Write rust-toolchain.toml
        shell: bash
        run: |
          set -eo pipefail

          cat > rust-toolchain.toml <<'EOF'
          [toolchain]
          channel = "1.97"
          profile = "minimal"
          EOF

      # Byte-identical to the seed job's, and regenerated here rather than
      # restored: this job's checkout is fresh, and the registry LAYER
      # restoring is exactly the condition this step exists to run under —
      # see the file-level comment above for why this job proves the check
      # works warm as well as cold.
      - name: Write Root Cargo.toml For The MSRV Check
        shell: bash
        run: |
          set -eo pipefail

          cat > Cargo.toml <<'EOF'
          [package]
          name = "act-cache-msrv-probe"
          version = "0.1.0"
          edition = "2024"
          rust-version = "1.88"

          [dependencies]
          cfg-if = "1"
          EOF

          cargo generate-lockfile

      # Same suffix, same lock hash, same workspace mapping as the seed job, so
      # this restores exactly what that job's post step saved. The probe crate
      # is deliberately NOT recreated: restoring is what has to put
      # act-probe/target on disk, and building it first would let a broken
      # restore pass unnoticed.
      - name: Restore The Cache Saved By The Seed Job
        id: rust-toolchain
        uses: elioseverojunior/rust-toolchain@v0
        with:
          cache: true
          # Must be the same expression the seed job used, over a manifest
          # written byte-identically above: the hash is a segment of the
          # registry and build keys, so any divergence derives a different key
          # and misses by construction -- which is the exact failure this job
          # exists to detect, and would report as a bug in the save path.
          cache-key-hash: ${{ hashFiles('Cargo.lock') }}
          cache-key-suffix: act-cache
          cache-workspaces: act-probe -> act-probe/target
          cargo-tools: hexyl@0.17.0
          msrv-check: error

      # Same assertions as the seed job's — see there for why msrv-effective
      # is checked for presence rather than an exact value.
      - name: Verify MSRV Against A Real Dependency Graph
        shell: bash
        env:
          MSRV: ${{ steps.rust-toolchain.outputs.msrv }}
          MSRV_EFFECTIVE: ${{ steps.rust-toolchain.outputs.msrv-effective }}
          MSRV_SOURCE: ${{ steps.rust-toolchain.outputs.msrv-source }}
        run: |
          set -eo pipefail

          echo "msrv:           $MSRV"
          echo "msrv-effective: $MSRV_EFFECTIVE"
          echo "msrv-source:    $MSRV_SOURCE"

          if [[ "$MSRV" != "1.88" ]]; then
            echo "::error::msrv is '$MSRV', expected '1.88' from the root Cargo.toml"
            exit 1
          fi
          if [[ "$MSRV_SOURCE" != "cargo-toml" ]]; then
            echo "::error::msrv-source is '$MSRV_SOURCE', expected 'cargo-toml'"
            exit 1
          fi
          if [[ -z "$MSRV_EFFECTIVE" ]]; then
            echo "::error::msrv-effective is empty; the check against the real graph did not run"
            exit 1
          fi

      # DELIBERATELY WEAKER THAN `cicd.yml`'s `e2e-warm`, WHICH ASSERTS
      # `cache-hit == 'true'`. Do not reconcile the two by weakening that one.
      #
      # act's cache server normalises keys to lowercase; GitHub's preserves the
      # case it was given. `restoreLayers` classifies a restore by comparing the
      # returned key to the derived one with `===`, so under act a genuine full
      # hit comes back as `registry-linux-x64-…` against a derived
      # `registry-Linux-X64-…`, is classified `partial`, and `cache-hit` reports
      # false. Verified against reality rather than assumed: `E2E Warm Cache`
      # passes on ubuntu, macos and windows in CI, which is only possible if the
      # real service round-trips the case.
      #
      # So this asserts what act can actually prove — that both layers restored
      # something, and that the restore put files on disk. Making the production
      # comparison case-insensitive to satisfy act would change shipped
      # behaviour for a local tool's convenience; lowercasing keys at derivation
      # would do that AND invalidate every existing cache entry.
      - name: Verify The Round-Trip
        shell: bash
        env:
          CACHE_HIT: ${{ steps.rust-toolchain.outputs.cache-hit }}
          CACHE_JSON: ${{ steps.rust-toolchain.outputs.cache }}
          REGISTRY_RESULT: ${{ fromJSON(steps.rust-toolchain.outputs.cache).layers.registry.result }}
          BUILD_RESULT: ${{ fromJSON(steps.rust-toolchain.outputs.cache).layers.build.result }}
        run: |
          set -eo pipefail

          echo "cache-hit:       $CACHE_HIT (expected false under act; see above)"
          echo "registry result: $REGISTRY_RESULT"
          echo "build result:    $BUILD_RESULT"
          echo "cache: $CACHE_JSON"

          # A miss means the seed job's post step saved nothing the warm job can
          # find — the save path is broken, which is the whole reason this
          # workflow exists.
          for layer in registry build; do
            result="REGISTRY_RESULT"
            [[ "$layer" == "build" ]] && result="BUILD_RESULT"
            if [[ "${!result}" == "miss" || -z "${!result}" ]]; then
              echo "::error::${layer} restored nothing (result='${!result}'); the seed job's post step did not save it under a key this job can reach"
              exit 1
            fi
          done

          if [[ ! -d act-probe/target ]]; then
            echo "::error::the build layer restored no target directory"
            exit 1
          fi

          if ! find act-probe/target -type f | head -1 | grep -q .; then
            echo "::error::act-probe/target exists but is empty; nothing was actually extracted"
            exit 1
          fi

          echo "round-trip verified: both layers restored, target directory repopulated"
          find act-probe/target -type f | head -5

      # THE assertion the bin layer exists for. The seed job `cargo install`ed a
      # real tool and marked both it and a shim; a correct archive carries the
      # first and not the second.
      #
      # Note what makes the shim half meaningful: `rustup` is on disk here
      # either way, because this job installed it. The marker is what
      # distinguishes "restored from an archive that wrongly contained it" from
      # "put there by rustup". A bare `test -f rustup` would pass in both cases,
      # which is why it is not the check.
      - name: Verify The Shims Stayed Out Of The Archive
        shell: bash
        env:
          BIN_RESULT: ${{ fromJSON(steps.rust-toolchain.outputs.cache).layers.bin.result }}
        run: |
          set -eo pipefail

          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          echo "bin layer result: $BIN_RESULT"
          find "$bin" -maxdepth 1 -mindepth 1 -exec basename {} \; | sort | sed 's/^/  restored: /'

          if [[ "$BIN_RESULT" == "miss" ]]; then
            echo "::error::the bin layer restored nothing; the seed job's post step saved no archive, so this assertion would be vacuous"
            exit 1
          fi

          if [[ ! -x "$bin/hexyl" ]]; then
            echo "::error::hexyl is not present at all; neither the cache nor the installer produced it"
            exit 1
          fi

          # Presence alone proves nothing — a broken restore would simply have
          # reinstalled it. The seed's marker is what distinguishes "restored
          # from the bin layer" from "compiled again", and it survives only
          # because ensureTools saw the right version and left it alone.
          if ! grep -qa TOOL_MARKER_FROM_SEED "$bin/hexyl"; then
            echo "::error::hexyl is present but carries no seed marker, so it was reinstalled rather than restored — the bin layer is not doing its job"
            exit 1
          fi

          "$bin/hexyl" --version | sed 's/^/  hexyl reports: /'

          if grep -qa SHIM_MARKER_DO_NOT_ARCHIVE "$bin/rustup"; then
            echo "::error::the marked rustup shim was restored from the cache, so binPaths archived the shims — the negations are inert, exactly the tar --files-from regression buildPaths hit"
            exit 1
          fi

          echo "bin layer verified: hexyl round-tripped, the shims did not"

      # What this workflow does NOT establish, so nobody reads it as complete:
      #
      # The crates.io adapter is never called. `hexyl@0.17.0` is pinned, and
      # `resolveToolVersions` returns a pinned spec without touching the client
      # — which is the whole point of pinning, and is exactly why this harness
      # is reproducible offline. The consequence is that the one piece of
      # `cargo-tools` living in `src/index.ts`, outside the coverage gate, is
      # covered by neither this nor the unit suite. Only a `cargo-tools` entry
      # with no version would exercise it, at the cost of a network dependency
      # and a version that changes under the test.
      #
      # `ensureTools` probes `<crate-name> --version`, assuming the binary is
      # named after the crate. hexyl satisfies that, so the "kept" path is
      # genuinely exercised — but a crate whose binary differs (`ripgrep` ships
      # `rg`) fails the probe every run and reinstalls despite a perfect cache
      # hit. Correctness is unaffected; the caching is not. Nothing here catches
      # that, because the fixture was chosen to avoid it.
      #
      # The `.exe` half of every shim negation is never exercised here. act runs
      # Linux only, so those patterns are pinned by `paths.test.ts` and executed
      # solely by `cicd.yml`'s `windows-latest` E2E leg.
      #
      # And the archive itself is not inspected by any step here. The marker
      # pair is indirect: it proves the shims were not restored, not that they
      # were never written. The direct check is to decompress act's stored entry
      # and list it, which is act-local and therefore manual:
      #   zstd -dc ~/.cache/actcache/cache/<xx>/<n> | tar -tvf -
      #
      # Run against this workflow it lists exactly two entries — the 29-byte
      # stand-in inherited through the `bin-Linux-X64-` rung, and hexyl at
      # 1354157 bytes — with no shim and no directory entry. Those sum to the
      # 1354186 bytes the post step reports, so `measurePaths` and tar agree
      # byte for byte. That equality is the real invariant: when the negations
      # were missing from the measurement it read 291743789 for the same
      # directory, and `cache-budget` was silently comparing against a number
      # the archive never had.
